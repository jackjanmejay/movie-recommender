<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Intelligent Content Recommender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .results {
            margin-top: 20px;
        }
        
        .recommendation-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        
        .recommendation-card:hover {
            transform: translateX(5px);
            background: #f0f0f0;
        }
        
        .rec-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        
        .rec-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .rec-type {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .rec-rating {
            color: #ff9800;
            font-weight: 600;
        }
        
        .rec-ratings {
            color: #666;
        }
        
        .rec-genres {
            color: #666;
            font-size: 0.85rem;
        }
        
        .rec-explanation {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
            color: #555;
            font-size: 0.9rem;
            font-style: italic;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab-btn {
            background: none;
            color: #666;
            padding: 10px 20px;
            border-radius: 0;
            margin-bottom: -2px;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        
        .tab-pane {
            display: none;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Intelligent Content Recommender</h1>
            <p>Movies • TV Series • Documentaries</p>
            <p style="font-size: 0.9rem; margin-top: 10px;">Powered by 100,000+ real user ratings</p>
        </div>
        
        <div class="card">
            <div class="stats" id="stats">
                <div class="stat-box">
                    <div class="stat-number" id="total-titles">—</div>
                    <div class="stat-label">Total Titles</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="avg-rating">—</div>
                    <div class="stat-label">Avg Rating</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="movies-count">—</div>
                    <div class="stat-label">Movies</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="tv-count">—</div>
                    <div class="stat-label">TV Series</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="doc-count">—</div>
                    <div class="stat-label">Documentaries</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('recommend')">🎯 Recommendations</button>
                <button class="tab-btn" onclick="showTab('search')">🔍 Search</button>
                <button class="tab-btn" onclick="showTab('year')">📅 By Year</button>
            </div>
            
            <!-- Recommendations Tab -->
            <div id="recommend-tab" class="tab-pane active">
                <h2>Get Personalized Recommendations</h2>
                <form id="recommend-form">
                    <div class="form-group">
                        <label>Content Type</label>
                        <select name="content_type" id="content_type">
                            <option value="Movie">Movies</option>
                            <option value="TV Series">TV Series</option>
                            <option value="Documentary">Documentaries</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Genre (Optional)</label>
                        <select name="genre" id="genre">
                            <option value="All">All Genres</option>
                            {% for genre in genres %}
                            <option value="{{ genre }}">{{ genre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Number of Recommendations</label>
                        <select name="n" id="rec-n">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <button type="submit">🎯 Get Recommendations</button>
                </form>
                <div id="rec-results" class="results"></div>
            </div>
            
            <!-- Search Tab -->
            <div id="search-tab" class="tab-pane">
                <h2>Search by Title</h2>
                <form id="search-form">
                    <div class="form-group">
                        <label>Keyword</label>
                        <input type="text" name="keyword" placeholder="e.g., Matrix, Breaking Bad, Inception" required>
                    </div>
                    <div class="form-group">
                        <label>Max Results</label>
                        <select name="n" id="search-n">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                        </select>
                    </div>
                    <button type="submit">🔍 Search</button>
                </form>
                <div id="search-results" class="results"></div>
            </div>
            
            <!-- By Year Tab -->
            <div id="year-tab" class="tab-pane">
                <h2>Best of the Year</h2>
                <form id="year-form">
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" name="year" value="1994" min="1900" max="2024" required>
                    </div>
                    <div class="form-group">
                        <label>Content Type</label>
                        <select name="content_type" id="year-content-type">
                            <option value="Movie">Movies</option>
                            <option value="All">All Content</option>
                        </select>
                    </div>
                    <button type="submit">📅 Get Top Content</button>
                </form>
                <div id="year-results" class="results"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Load statistics on page load
        loadStats();
        
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-pane').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        function loadStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-titles').textContent = data.total_titles.toLocaleString();
                    document.getElementById('avg-rating').textContent = data.avg_rating + '/10';
                    document.getElementById('movies-count').textContent = data.movies.toLocaleString();
                    document.getElementById('tv-count').textContent = data.tv_series.toLocaleString();
                    document.getElementById('doc-count').textContent = data.documentaries.toLocaleString();
                })
                .catch(error => console.error('Error loading stats:', error));
        }
        
        function displayRecommendations(data, containerId) {
            const container = document.getElementById(containerId);
            if (!data.recommendations || data.recommendations.length === 0) {
                container.innerHTML = '<div class="error">No recommendations found. Try different filters!</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < data.recommendations.length; i++) {
                const rec = data.recommendations[i];
                html += `
                    <div class="recommendation-card">
                        <div class="rec-title">${i+1}. ${rec.title}${rec.year ? ` (${rec.year})` : ''}</div>
                        <div class="rec-meta">
                            <span class="rec-type">${rec.type}</span>
                            <span class="rec-rating">⭐ ${rec.rating}/10</span>
                            <span class="rec-ratings">📊 ${rec.num_ratings.toLocaleString()} ratings</span>
                        </div>
                        <div class="rec-genres">🏷️ ${rec.genres || 'Unknown'}</div>
                        <div class="rec-explanation">💡 ${rec.explanation}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
        
        // Handle recommendations form
        document.getElementById('recommend-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const container = document.getElementById('rec-results');
            container.innerHTML = '<div class="loading">🎬 Finding recommendations...</div>';
            
            const formData = new FormData(e.target);
            const response = await fetch('/recommend', { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.success) {
                displayRecommendations(data, 'rec-results');
            } else {
                container.innerHTML = `<div class="error">Error: ${data.error}</div>`;
            }
        });
        
        // Handle search form
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const container = document.getElementById('search-results');
            container.innerHTML = '<div class="loading">🔍 Searching...</div>';
            
            const formData = new FormData(e.target);
            const response = await fetch('/search', { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.success && data.results.length > 0) {
                let html = '';
                for (let i = 0; i < data.results.length; i++) {
                    html += `
                        <div class="recommendation-card">
                            <div class="rec-title">${i+1}. ${data.results[i]}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">No results found for "${data.keyword}"</div>`;
            }
        });
        
        // Handle year form
        document.getElementById('year-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const container = document.getElementById('year-results');
            container.innerHTML = '<div class="loading">📅 Loading top content...</div>';
            
            const formData = new FormData(e.target);
            const response = await fetch('/by_year', { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.success && data.results.length > 0) {
                let html = '';
                for (let i = 0; i < data.results.length; i++) {
                    html += `
                        <div class="recommendation-card">
                            <div class="rec-title">${i+1}. ${data.results[i]}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">No content found from ${data.year}</div>`;
            }
        });
    </script>
</body>
</html>
